[package]
name = "agent"
version = "0.1.0"
description = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
time = { version = "0.3.45", features = ["serde", "formatting", "parsing"] }
thiserror = "2.0"
filetime = "0.2"
blake3 = { version = "1.8", features = ["serde"] }
libsync3 = { git = "https://github.com/Bechma/libsync3.git", rev = "168968a5813d9c9a6f4ac535da672959ed14d586", features = ["serde"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3.14"
postcard = { version = "1.1", features = ["alloc"] }
