[workspace]
members = []
resolver = "3"

[workspace.package]
description = "File and folder synchronizer local or remote"
edition = "2024"
license = "AGPL-3"

[workspace.dependencies]
anyhow = "1.0"
blake3 = { version = "1.8", features = ["serde"] }

serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.19", features = ["v4", "serde"] }
time = { version = "0.3.45", features = ["serde"] }

tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
tempfile = "3.14"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
pedantic = "deny"
